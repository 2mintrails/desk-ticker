name: Check server
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check.yml', 'server/check.txt']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Metal history depth
        run: |
          curl -s https://desk-ticker.twominutetrails.workers.dev/v2/feed > f.json
          node -e "const m=require('./f.json').metals||{};for(const k of ['gold','silver']){const l=m[k]||[];console.log('HIST',k,l.length,'newest',JSON.stringify(l[0]),'oldest',JSON.stringify(l.at(-1)))};console.log('SRC',m.source,m.goldSource,m.silverSource)"
