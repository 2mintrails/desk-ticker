name: Check server
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check.yml', 'server/check.txt']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Local news language
        run: |
          curl -s "https://desk-ticker.twominutetrails.workers.dev/v2/local?lat=27.88&lon=78.08&city=Aligarh" | node -e "const j=JSON.parse(require('fs').readFileSync(0));console.log('TR',j.tr,'city',j.city);for(const i of j.items||[])console.log('ITEM',i.t)"
