name: Check server
on:
  push:
    branches: [main, preview]
    paths: ['.github/workflows/check.yml', 'server/check.txt']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Portfolio news slides
        run: |
          curl -s https://desk-ticker.twominutetrails.workers.dev/v2/feed > f.json
          node -e "const n=require('./f.json').news||{};for(const k of ['Watch','WatchUS']){console.log('SLIDE',k,new Date(n[k]?.at||0).toISOString());for(const x of (n[k]?.items||[]))console.log('ITEM',k,x.kind||'-',x.kind==='sec'?x.label:x.tick,'|',String(x.t).slice(0,95))}"
