name: Check server
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check.yml', 'server/check.txt']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Open the live app like an iPhone
        run: |
          npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps webkit chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { webkit, chromium, devices } from 'playwright';
          for (const [name, bt] of [['webkit', webkit], ['chromium', chromium]]) {
            const b = await bt.launch(), ctx = await b.newContext({ ...devices['iPhone 15 Pro Max'], timezoneId: 'Asia/Kolkata' }), pg = await ctx.newPage();
            const logs = []; pg.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') logs.push(m.type() + ': ' + m.text()); }); pg.on('pageerror', e => logs.push('PAGEERROR ' + e.message + ' @ ' + (e.stack || '').split('\n').slice(0, 3).join(' | ')));
            await pg.goto('https://2mintrails.github.io/desk-ticker/?_=' + Date.now()); await pg.waitForTimeout(15000);
            const o = await pg.evaluate(() => ({ version: (document.querySelector('meta[name="ticker-version"]') || {}).content, slides: typeof slides !== 'undefined' ? slides.length : 'undefined', bodyText: document.body.innerText.slice(0, 200).replace(/\s+/g, ' '), active: (document.querySelector('.slide.active') || {}).dataset?.title }));
            console.log(name, JSON.stringify(o)); console.log(logs.slice(0, 15).join('\n'));
            await pg.screenshot({ path: name + '.png' }); await b.close();
          }
          JS
          node t.mjs
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: '*.png' }
