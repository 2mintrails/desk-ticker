name: Check server
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check.yml', 'server/check.txt']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Status
        run: curl -s https://desk-ticker.twominutetrails.workers.dev/v1/status; echo
      - name: Open the live app and read what it shows
        run: |
          npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch(), pg = await b.newPage({ viewport: { width: 915, height: 412 }, timezoneId: 'Asia/Kolkata' });
          const logs = []; pg.on('console', m => { if (m.type() !== 'log') logs.push(m.type() + ': ' + m.text()); }); pg.on('pageerror', e => logs.push('ERROR ' + e.message));
          await pg.goto('https://2mintrails.github.io/desk-ticker/?_=' + Date.now()); await pg.waitForTimeout(25000);
          const o = await pg.evaluate(() => ({ version: document.querySelector('meta[name="ticker-version"]').content, dataFrom,
            nifty: document.querySelector('.ix-p').textContent, gold: document.getElementById('gold').textContent, goldD: document.getElementById('goldD').textContent,
            silver: document.getElementById('silver').textContent, note: document.getElementById('mNote').textContent, GR }));
          console.log(JSON.stringify(o, null, 1)); console.log(logs.slice(0, 20).join('\n')); await b.close();
          JS
          node t.mjs
