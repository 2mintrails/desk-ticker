name: Check server
on:
  push:
    branches: [main, preview]
    paths: ['.github/workflows/check.yml', 'server/check.txt']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Portfolio list
        run: |
          curl -s https://desk-ticker.twominutetrails.workers.dev/v2/feed > f.json
          node -e "const f=require('./f.json');const c=f.cfg||f.settings||{};const w=(c.watch||{}).in||[];console.log('KEYS',Object.keys(f).join(','));console.log('CFGKEYS',Object.keys(c).join(','));for(const x of w)console.log('STOCK',x.sym,'|',x.name,'|',x.tick)"
