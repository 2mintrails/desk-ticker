name: Check server
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check.yml', 'server/check.txt']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Long metal history
        run: |
          curl -s https://desk-ticker.twominutetrails.workers.dev/v2/feed > f.json
          node -e "const L=(require('./f.json').metals||{}).long||{};for(const k of ['gold','silver']){const l=L[k]||[];console.log('LONG',k,l.length,JSON.stringify(l.slice(0,2)),JSON.stringify(l.slice(-3)))}"
