name: Check server
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check.yml', 'server/check.txt']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: IBJA
        run: |
          curl -sL -A "Mozilla/5.0" -o i.html https://www.ibjarates.com/
          python3 - <<'PY'
          import re,html,json
          s=open('i.html',encoding='utf-8',errors='replace').read()
          for k in ['HdnGold','HdnSilver']:
              m=re.search('id="'+k+'" value="([^"]*)"',s); v=json.loads(html.unescape(m.group(1)))
              print(k, {kk:len(vv) for kk,vv in v.items()}); 
              for kk,vv in v.items(): print('  ',kk, vv[-8:])
          for m in re.finditer(r'id="([A-Za-z]*(Silver|Gold)[A-Za-z0-9]*)"[^>]*>\s*([\d,.]+)', s): print(m.group(1), m.group(3))
          i=s.find('Silver 999'); print(re.sub(r'<[^>]+>',' ',s[i-200:i+800]).split()[:80])
          PY
      - name: Feed v2
        run: |
          curl -s https://desk-ticker.twominutetrails.workers.dev/v2/feed > f.json
          node -e "const f=require('./f.json');const q=f.quotes;console.log('at',new Date(f.at).toISOString(),'quotes',Object.keys(q).length);
          for(const s of ['INDEXNSE:NIFTY_50','INDEXBOM:SENSEX','INDEXSP:.INX','CURRENCY:USDINR','NSE:RELIANCE'])console.log(s,JSON.stringify(q[s]));
          const src={};Object.values(q).forEach(x=>src[x.src]=(src[x.src]||0)+1);console.log('sources',JSON.stringify(src));
          console.log('charts',Object.entries(f.charts).map(([k,v])=>k+':'+v.line.length+' pts, last '+JSON.stringify(v.line.slice(-1))).join(' | '));
          console.log('metals',JSON.stringify(f.metals.gold.slice(0,3)),JSON.stringify(f.metals.silver.slice(0,2)));
          console.log('news',Object.entries(f.news).map(([k,v])=>k+':'+v.items.length).join(' '),'aqi',JSON.stringify(f.aqi));
          console.log('metar',f.metar.length,'airports',f.airports.length,'settings',Object.keys(f.settings).length);
          console.log('health',JSON.stringify(f.health.ages), Object.entries(f.health.runs).map(([k,r])=>k+':'+r.ok).join(' '));"
      - name: Yahoo daily closes
        run: |
          curl -s -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/spark?symbols=%5ENSEI,RELIANCE.NS,USDINR%3DX,%5EGSPC,M_M.NS,M%26M.NS&range=5d&interval=1d" | head -c 3000; echo
          curl -s -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI?range=1d&interval=5m" | node -e "const m=JSON.parse(require('fs').readFileSync(0)).chart.result[0].meta;console.log(JSON.stringify({p:m.regularMarketPrice,cpc:m.chartPreviousClose,pc:m.previousClose,t:m.regularMarketTime}))"
      - name: Zero-change check
        run: |
          node -e "const f=require('./f.json');const z=Object.entries(f.quotes).filter(([k,x])=>x.c===0).map(([k,x])=>k+'='+x.p+'/'+x.src);console.log('zero change:',z.length,z.join(' '));console.log('google:',Object.entries(f.quotes).filter(([k,x])=>x.src==='google').map(([k])=>k).join(' '))"
          curl -sL "https://docs.google.com/spreadsheets/d/e/2PACX-1vQvtAtoM3GTJ--tbsHV5cWMPhFrtaofoAyvqSbRt2H2-n2_pUiQ5YYnaVsXRgRTe1ieAnODMXPw1joB/pub?gid=1087668592&single=true&output=csv" | cut -d, -f1-4 | head -70 | tr '\n' ' '
      - name: Open the live app and read what it shows
        run: |
          npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch(), pg = await b.newPage({ viewport: { width: 915, height: 412 }, timezoneId: 'Asia/Kolkata' });
          const logs = []; pg.on('console', m => { if (m.type() !== 'log' && !/Failed to load resource/.test(m.text())) logs.push(m.type() + ': ' + m.text()); }); pg.on('pageerror', e => logs.push('ERROR ' + e.message));
          await pg.goto('https://2mintrails.github.io/desk-ticker/?_=' + Date.now()); await pg.waitForTimeout(20000);
          const o = await pg.evaluate(() => ({ version: document.querySelector('meta[name="ticker-version"]').content, dataFrom,
            nifty: document.querySelector('.ix-p').textContent, chg: document.querySelector('.ix-p').parentElement.textContent.replace(/\s+/g,' ').slice(0,120),
            note: (document.getElementById('srcNote')||{}).textContent, dataLine: (document.getElementById('dataLine')||{}).textContent,
            gold: document.getElementById('gold').textContent, goldWk: document.getElementById('goldW').innerText.replace(/\n/g,' | '), silver: document.getElementById('silver').textContent, silverWk: document.getElementById('silverW').innerText.replace(/\n/g,' | '), mnote: document.getElementById('mNote').textContent, ranges: [...document.querySelectorAll('#mRange button')].map(b=>b.textContent+(b.disabled?'(off)':'')+(b.classList.contains('on')?'*':'')).join(' '),
            news: [...document.querySelectorAll('#newsIN li .tt')].length, aqi: document.getElementById('wAqi').textContent, temp: (document.getElementById('wTemp')||{}).textContent,
            chartPts: (CHARTS.nifty.mem||{pts:[]}).pts.length }));
          console.log(JSON.stringify(o, null, 1)); console.log(logs.slice(0, 20).join('\n')); await b.close();
          JS
          node t.mjs
