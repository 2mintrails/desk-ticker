name: Check server
on:
  push:
    branches: [main, preview]
    paths: ['.github/workflows/check.yml', 'server/check.txt']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Feed snapshot
        run: |
          curl -s https://desk-ticker.twominutetrails.workers.dev/v2/feed | gzip -9 | base64 -w 0 > f.b64; echo "SIZE $(wc -c < f.b64)"; echo "FEEDB64 $(cat f.b64)"
