name: probe
on:
  push:
    paths: ['server/probe.txt']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Analyst data on Yahoo
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, http.cookiejar, json
          cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj)); UA={'User-Agent':'Mozilla/5.0'}
          try: op.open(urllib.request.Request('https://fc.yahoo.com/',headers=UA))
          except Exception: pass
          crumb=op.open(urllib.request.Request('https://query1.finance.yahoo.com/v1/test/getcrumb',headers=UA)).read().decode()
          for s in ['TSM','AMZN','RELIANCE.NS','INFY.NS','SONACOMS.NS','POLYMED.NS']:
            try:
              j=json.load(op.open(urllib.request.Request('https://query2.finance.yahoo.com/v10/finance/quoteSummary/'+urllib.parse.quote(s)+'?modules=recommendationTrend,financialData,upgradeDowngradeHistory&crumb='+crumb,headers=UA)))
              r=j['quoteSummary']['result'][0]; fd=r.get('financialData',{}); rt=(r.get('recommendationTrend',{}).get('trend') or [{}])[0]
              ug=(r.get('upgradeDowngradeHistory',{}).get('history') or [])[:3]
              g=lambda k:(fd.get(k) or {}).get('raw')
              print(s,'| key',fd.get('recommendationKey'),'mean',g('recommendationMean'),'n',g('numberOfAnalystOpinions'),'| target mean',g('targetMeanPrice'),'hi',g('targetHighPrice'),'lo',g('targetLowPrice'),'| trend',{k:rt.get(k) for k in ['period','strongBuy','buy','hold','sell','strongSell']})
              for u in ug: print('   ',u.get('firm'),u.get('action'),u.get('fromGrade'),'->',u.get('toGrade'),u.get('currentPriceTarget'),u.get('epochGradeDate'))
            except Exception as e: print(s,'ERR',e)
          PY
