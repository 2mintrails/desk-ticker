name: UI check
on:
  workflow_dispatch:
  push:
    branches: [main, preview]
    paths: ['index.html', 'tools/ui-check.mjs', '.github/workflows/ui-check.yml']
jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps webkit chromium >/dev/null 2>&1
      - run: (python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 2
      - run: node tools/ui-check.mjs http://localhost:8080/index.html
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ui-shots, path: shots/ }
