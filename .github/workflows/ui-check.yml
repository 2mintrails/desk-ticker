name: UI check
on:
  workflow_dispatch:
    inputs:
      sizes: { description: 'sizes (e.g. 375x667, blank = all)', default: '' }
  push:
    branches: [main, preview]
    paths: ['index.html', 'tools/ui-check.mjs', '.github/workflows/ui-check.yml']
# a newer push replaces a running check
concurrency:
  group: ui-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: { look: [ambient, swiss, retro, calm, anime, xsnow, xmarket] }   # each theme in parallel: ~5 min in all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: pw-webkit-1.49.1 }
      - run: npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps webkit >/dev/null 2>&1
      - run: (python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 2
      - run: node tools/ui-check.mjs http://localhost:8080/index.html
        env:
          LOOKS: ${{ matrix.look }}
          SIZES: ${{ inputs.sizes }}
          ENGINES: webkit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots-${{ matrix.look }}
          path: shots/
